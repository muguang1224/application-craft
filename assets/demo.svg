<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="450" viewBox="0 0 1280 450" role="img" aria-label="application-craft terminal demo — resume vs job description coverage report">
  <rect width="1280" height="450" rx="14" fill="#0b0f14"/>
  <rect width="1280" height="450" rx="14" fill="none" stroke="#30363d"/>
  <line x1="0" y1="42" x2="1280" y2="42" stroke="#30363d"/>
  <circle cx="26" cy="21" r="7" fill="#ff5f56"/>
  <circle cx="50" cy="21" r="7" fill="#ffbd2e"/>
  <circle cx="74" cy="21" r="7" fill="#27c93f"/>
  <text x="640" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="14" fill="#8b949e">application-craft</text>

  <g font-family="ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace" font-size="16">
    <text x="34" y="80" fill="#7ee787">$</text>
    <text x="52" y="80" fill="#c9d1d9">python3 scripts/ats_check.py --resume resume.txt --jd jd.txt --out ats-report.md</text>

    <text x="34" y="118" fill="#f0f6fc" font-weight="700"># Resume ↔ job-description check</text>
    <text x="34" y="146" fill="#c9d1d9">Keyword coverage: </text>
    <text x="212" y="146" fill="#d2a8ff" font-weight="700">7/17 (41%)</text>

    <text x="34" y="186" fill="#a371f7" font-weight="700">## In your resume</text>
    <text x="34" y="212" fill="#c9d1d9">`backend`  `payments`  `distributed`  `engineer`  `services`</text>

    <text x="34" y="252" fill="#a371f7" font-weight="700">## Missing</text>
    <text x="34" y="278" fill="#c9d1d9">`senior`  `scale`  `reliability`  `observability`  `platform`</text>

    <text x="34" y="318" fill="#a371f7" font-weight="700">## Structure</text>
    <text x="34" y="344" fill="#c9d1d9">- Bullets: 7, </text>
    <text x="182" y="344" fill="#3fb950">5 (71%) start with a strong action verb</text>

    <text x="34" y="378" fill="#8b949e">Guidance only — tailor by rewording *real* experience.</text>
    <text x="34" y="402" fill="#f85149">A missing term you genuinely lack is information, not a gap to fake.</text>
  </g>
</svg>
