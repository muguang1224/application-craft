<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" role="img" aria-label="application-craft — tailor job applications and academic submissions, honestly">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#170f22"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8957e5" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" rx="16" fill="url(#bg3)"/>
  <rect width="1280" height="300" rx="16" fill="none" stroke="#30363d"/>
  <rect width="640" height="300" rx="16" fill="url(#glow3)"/>

  <!-- document glyph -->
  <rect x="76" y="84" width="92" height="132" rx="10" fill="#1b1226" stroke="#a371f7" stroke-width="3"/>
  <line x1="96" y1="118" x2="148" y2="118" stroke="#8957e5" stroke-width="6" stroke-linecap="round"/>
  <line x1="96" y1="140" x2="148" y2="140" stroke="#6e40c9" stroke-width="6" stroke-linecap="round"/>
  <line x1="96" y1="162" x2="126" y2="162" stroke="#6e40c9" stroke-width="6" stroke-linecap="round"/>
  <circle cx="170" cy="214" r="27" fill="#3fb950"/>
  <path d="M158 214 l9 9 l16 -19" fill="none" stroke="#0d1117" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round"/>

  <text x="222" y="138" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" fill="#f0f6fc" letter-spacing="-1">application-craft</text>
  <text x="225" y="180" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="23" fill="#8b949e">Tailor job applications and academic submissions — honestly</text>

  <g font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="15">
    <rect x="224" y="212" width="150" height="36" rx="18" fill="#8957e5" fill-opacity="0.18" stroke="#8957e5" stroke-opacity="0.55"/>
    <text x="299" y="236" text-anchor="middle" fill="#d2a8ff">0 dependencies</text>

    <rect x="388" y="212" width="126" height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#30363d"/>
    <text x="451" y="236" text-anchor="middle" fill="#c9d1d9">resume ↔ JD</text>

    <rect x="528" y="212" width="142" height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#30363d"/>
    <text x="599" y="236" text-anchor="middle" fill="#c9d1d9">cover letters</text>

    <rect x="684" y="212" width="174" height="36" rx="18" fill="#ffffff" fill-opacity="0.04" stroke="#30363d"/>
    <text x="771" y="236" text-anchor="middle" fill="#c9d1d9">journal checklist</text>
  </g>

  <text x="1248" y="52" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="16" fill="#484f58">no fabrication</text>
</svg>
